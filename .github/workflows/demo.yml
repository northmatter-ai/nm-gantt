# Builds apps/demo and publishes it to GitHub Pages: https://northmatter-ai.github.io/nm-gantt/
# Runs on every push to master (and by hand from the Actions tab).
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write      # deploy to Pages
  id-token: write   # Pages deployment token
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build demo for /nm-gantt/
        run: pnpm --filter @northmatter/gantt-demo build
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
