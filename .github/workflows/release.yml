# Publishes all @northmatter-ai/* packages to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Each package must list this
# repository and workflow file (release.yml) as a trusted publisher on npmjs.com.
# Versions with a pre-release suffix (v0.2.0-beta.1) go to the `next` dist-tag, not `latest`.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write   # trusted publishing + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package versions
        run: |
          v=$(node -p "require('./packages/gantt/package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != packages v$v"; exit 1; }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run ci
      - run: pnpm check:packages
      - name: Publish
        run: |
          tag=latest; case "$GITHUB_REF_NAME" in *-*) tag=next;; esac
          pnpm -r --filter "./packages/*" publish --access public --tag "$tag" --provenance --no-git-checks
